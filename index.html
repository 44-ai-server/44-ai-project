<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>44 AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:white;font-family:Arial;height:100vh;display:flex;flex-direction:column}
header{padding:20px;background:#191920;border-bottom:1px solid #30303a;font-size:25px;font-weight:bold;color:#a78bfa}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{padding:13px 16px;border-radius:16px;max-width:85%;line-height:1.5;white-space:pre-wrap}
.user{background:#6941c6;align-self:flex-end}
.ai{background:#24242e;align-self:flex-start}
.speak{background:#383344;color:white;border:0;border-radius:9px;padding:7px 12px;margin-top:8px}
.bottom{display:flex;padding:14px;gap:9px;background:#191920}
input{flex:1;min-width:0;padding:14px;border:1px solid #444;border-radius:12px;background:#292933;color:white;font-size:16px}
.send{border:0;border-radius:12px;background:#8055dc;color:white;padding:0 20px;font-size:18px}
</style>
</head>
<body>
<header>✦ 44 AI</header>
<div id="chat">
<div class="msg ai">
Привет! Я 44 AI. Чем могу помочь?
<br>
<button class="speak" onclick="speakText(this)">🔊 Озвучить</button>
</div>
</div>
<div class="bottom">
<input id="message" placeholder="Напиши сообщение...">
<button class="send" onclick="send()">➤</button>
</div>
<script>
function speakText(button){
 const text=button.parentElement.firstChild.textContent.trim();
 speechSynthesis.cancel();
 const voice=new SpeechSynthesisUtterance(text);
 voice.lang='ru-RU';
 voice.rate=1;
 speechSynthesis.speak(voice);
}
function send(){
 const input=document.getElementById('message');
 const value=input.value.trim();
 if(!value)return;
 const chat=document.getElementById('chat');

 const user=document.createElement('div');
 user.className='msg user';
 user.textContent=value;
 chat.appendChild(user);
 input.value='';

 const answer=document.createElement('div');
 answer.className='msg ai';
 answer.appendChild(document.createTextNode(
 'Я получил твоё сообщение! Настоящий ИИ подключим следующим этапом.'
 ));
 const button=document.createElement('button');
 button.className='speak';
 button.textContent='🔊 Озвучить';
 button.onclick=()=>speakText(button);
 answer.appendChild(document.createElement('br'));
 answer.appendChild(button);
 chat.appendChild(answer);
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('message').addEventListener('keydown',e=>{
 if(e.key==='Enter')send();
});
</script>
</body>
</html>
